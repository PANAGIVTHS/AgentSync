# Copied to ~/Agent/compose.yaml by `agent setup`. Paths come from ~/Agent/.env.
name: agent
services:
  agent:
    image: ${AGENT_IMAGE:-agent-runtime:local}
    container_name: agent
    init: true
    user: "${AGENT_UID}:${AGENT_GID}"
    environment:
      HOME: /home/agent
      TERM: xterm-256color
    volumes:
      - ${AGENT_HOME_DIR}:/home/agent          # Claude login, settings, skills
      - ${AGENT_WORK_DIR}:/work                # the agent's clones, one per shared repo
      - ${AGENT_MIRRORS_DIR}:/mirrors:ro       # your branches; the agent cannot write here
      - ${AGENT_HANDOFFS_DIR}:/handoffs        # task summaries for your review
      - ${AGENT_VAULT_DIR}:/vault              # Obsidian memory
      - ${AGENT_TOOLS_DIR}:/tools              # programs the agent installs; kept across rebuilds
    restart: unless-stopped
    logging:                                   # keep `docker logs` from filling Docker's disk
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
